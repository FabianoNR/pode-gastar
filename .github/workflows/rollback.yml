name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA completo (40 caracteres hexadecimais minúsculos) do commit que deve voltar ao ar'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    # O11: fora da main o job aparece como pulado e não chama a API nem o /health.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # O12: mesmo grupo do job de deploy do ci.yml; quem chega depois espera.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # O5 a O10: valida o SHA antes de qualquer chamada, pede o deploy do commit pela
      # API do Render e espera o /health expor esse commit.
      - name: Validar o SHA, pedir o deploy do commit e esperar o /health
        env:
          SHA_PEDIDO: ${{ inputs.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
        run: bash scripts/rollback.sh "$SHA_PEDIDO"
