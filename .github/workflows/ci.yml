name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: ./mvnw verify

  # O4, O12: deploy hook e smoke test em um único job, em sequência, no mesmo grupo de
  # concorrência do rollback; quem chega depois espera.
  # ADR 0014: o Render constrói a aplicação a partir do repositório; o CI não publica imagem.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # O16: tempo limite do job.
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Disparar o deploy hook e esperar o /health expor o commit publicado
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
          SHA_PUBLICADO: ${{ github.sha }}
        run: bash scripts/deploy.sh "$SHA_PUBLICADO"
